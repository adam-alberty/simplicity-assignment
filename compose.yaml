services:
  client-web:
    container_name: test-city-client-web
    restart: unless-stopped
    build:
      context: ./client-web
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://api:8080
    ports:
      - 3000:80
    security_opt:
      - "no-new-privileges=true"

  db:
    image: postgres:18
    container_name: test-city-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
