info:
  name: List announcements
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/announcements?limit=100&query=sublime"
  params:
    - name: limit
      value: "100"
      type: query
    - name: query
      value: sublime
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
